<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dev-pipeline · Панель конвейера</title>
<style>
:root { --bg:#0f1117; --panel:#171a23; --panel2:#1d2130; --border:#2a2f42; --text:#e6e8ef; --muted:#9aa2b5; --accent:#6ea8ff; --green:#4ade80; --yellow:#facc15; --red:#f87171; --code:#0b0e14; }
* { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; font:14px/1.55 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
header { display:flex; align-items:center; gap:16px; padding:10px 20px; background:#12141c; border-bottom:1px solid var(--border); }
header h1 { font-size:16px; margin:0; }
header .status { font-size:12px; color:var(--muted); margin-left:auto; }
nav { display:flex; gap:6px; padding:10px 20px; border-bottom:1px solid var(--border); background:#14161f; }
nav button { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 14px; cursor:pointer; font-size:13px; }
nav button:hover { border-color:var(--accent); }
nav button.active { background:var(--accent); color:#0b0f17; border-color:var(--accent); font-weight:600; }
main { padding:20px 28px; overflow:auto; height:calc(100vh - 96px); }
.card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
.card h3 { margin:0 0 10px; font-size:14px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--border); vertical-align:top; }
th { color:var(--muted); font-weight:600; white-space:nowrap; }
tr.clickable { cursor:pointer; }
tr.clickable:hover { background:var(--panel2); }
code, pre { font-family:Consolas,monospace; }
pre { background:var(--code); border:1px solid var(--border); border-radius:8px; padding:12px; overflow:auto; font-size:12.5px; max-height:500px; }
.badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; }
.badge.ok { background:#123b26; color:var(--green); }
.badge.warn { background:#3b3312; color:var(--yellow); }
.badge.err { background:#3b1212; color:var(--red); }
.badge.info { background:#12263b; color:var(--accent); }
.muted { color:var(--muted); }
.empty { color:var(--muted); padding:20px; text-align:center; }
.back { margin-bottom:12px; }
</style>
</head>
<body>
<header>
  <h1>dev-pipeline · Панель конвейера</h1>
  <select id="projectSelect" style="background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;"></select>
  <span class="status" id="status">…</span>
</header>
<nav>
  <button data-tab="plan" class="active">План</button>
  <button data-tab="task" id="taskTabBtn" style="display:none">Задача</button>
</nav>
<main id="content"><div class="empty">Загрузка…</div></main>
<script>
const $ = (id) => document.getElementById(id);
const state = { tab: 'plan', currentTask: null };
let activeProject = '';

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function get(path){ const r = await fetch(path); if(!r.ok) throw new Error(r.status); return r.json(); }

const STATUS_COLOR = { 'open':'warn', 'in_progress':'info', 'done_report':'info', 'verified':'ok', 'rejected':'err', 'closed':'ok' };
function badge(s){ const c = STATUS_COLOR[s] || 'info'; return '<span class="badge '+c+'">'+esc(s)+'</span>'; }

/* ---------- Вкладка 1: ПЛАН (таблица) ---------- */
async function renderPlan(){
  let plan;
  try { plan = await get('/api/plan?project='+encodeURIComponent(activeProject)); }
  catch(e){ $('content').innerHTML = '<div class="empty">ошибка: '+esc(String(e))+'</div>'; return; }

  const rows = plan.rows || [];
  const total = plan.total || 0, done = plan.done || 0;
  const pct = total ? Math.round(100*done/total) : 0;

  let html = '';

  // Заголовок: проект + прогресс
  html += '<div class="card"><h3>План проекта: '+esc(plan.project)+'</h3>'+
    '<div class="muted" style="margin-bottom:8px">Закрыто '+done+' из '+total+' задач ('+pct+'%).</div>'+
    '<div style="height:12px;background:var(--panel2);border-radius:6px;overflow:hidden">'+
    '<div style="height:100%;width:'+pct+'%;background:var(--green);border-radius:6px"></div></div></div>';

  // Таблица плана
  html += '<div class="card"><table><thead><tr>'+
    '<th>WBS</th><th>ID</th><th>Задача</th><th>Статус</th><th>Workflow</th><th>Приоритет</th>'+
    '<th>Отчёт</th><th>Вердикт</th></tr></thead><tbody>';
  for (const r of rows){
    const doc = r['документ'] ? r['документ'].split('\\').pop() : '—';
    const rpt = (r.report_refs && r.report_refs.length) ? '📄' : '—';
    const vrd = (r.verdict_refs && r.verdict_refs.length) ? '🧾' : '—';
    const status = r.status || (r.workflow_state === 'verified' ? 'done' : 'open');
    html += '<tr class="clickable" onclick="openTask(\''+esc(r.id)+'\')">'+
      '<td>'+esc(r.wbs||'')+'</td>'+
      '<td>'+esc(r.id)+'</td>'+
      '<td>'+esc(r.title)+'</td>'+
      '<td>'+badge(status)+'</td>'+
      '<td class="muted">'+esc(r.workflow_state||'')+'</td>'+
      '<td>'+esc(r.priority||'')+'</td>'+
      '<td>'+rpt+'</td>'+
      '<td>'+vrd+'</td></tr>';
  }
  html += '</tbody></table></div>';

  $('content').innerHTML = html;
}

/* ---------- Вкладка 2: ЗАДАЧА (детализация) ---------- */
async function openTask(id){
  state.currentTask = id;
  state.tab = 'task';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='task'));
  $('taskTabBtn').style.display = '';
  await renderTask(id);
}

async function renderTask(id){
  let t;
  try { t = await get('/api/task/'+id+'?project='+encodeURIComponent(activeProject)); }
  catch(e){ $('content').innerHTML = '<div class="empty">ошибка: '+esc(String(e))+'</div>'; return; }

  // Этапы: разбита → начато → агент → закончено → тест → проверено
  const steps = [
    ['Разбита', t['начато']||'—', 'info'],
    ['Агент', t['агент']||'—', 'info'],
    ['Закончено', t['завершено']||'—', t.status==='done_report'||t.status==='verified'?'ok':'warn'],
    ['Проверено', t['вердикт']||'—', t['вердикт']==='PASS'?'ok':(t['вердикт']?'err':'warn')],
  ];

  let html = '<button class="back" onclick="showPlan()">← К плану</button>';

  html += '<div class="card"><h3>'+esc(t.id)+': '+esc(t.title)+'</h3>'+
    '<div class="muted">Статус: '+badge(t.status)+' · Приоритет: '+esc(t.priority)+' · Документ: '+esc(t['документ']||'—')+'</div></div>';

  // Этапы
  html += '<div class="card"><h3>Этапы</h3><table><tr><th>Этап</th><th>Дата/значение</th><th>Статус</th></tr>';
  for (const [name, val, tone] of steps){
    html += '<tr><td>'+esc(name)+'</td><td>'+esc(val)+'</td><td>'+badge(tone)+'</td></tr>';
  }
  html += '</table></div>';

  // Отчёт
  if (t.report_text){
    html += '<div class="card"><h3>Отчёт исполнителя</h3><pre>'+esc(t.report_text)+'</pre></div>';
  }
  // Вердикт
  if (t.verdict_text){
    html += '<div class="card"><h3>Вердикт контролёра</h3><pre>'+esc(t.verdict_text)+'</pre></div>';
  }
  // События
  if (t.events && t.events.length){
    html += '<div class="card"><h3>События задачи</h3><table><tr><th>Событие</th><th>Время</th></tr>';
    for (const e of t.events) html += '<tr><td>'+esc(e.type)+'</td><td class="muted">'+esc(e.created_at)+'</td></tr>';
    html += '</table></div>';
  }

  $('content').innerHTML = html;
}

function showPlan(){
  state.tab = 'plan';
  $('taskTabBtn').style.display = 'none';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='plan'));
  renderPlan();
}

async function setProject(name){
  activeProject = name || '';
  $('projectSelect').value = name;
  if (state.tab==='plan') renderPlan();
  else renderTask(state.currentTask);
}

async function boot(){
  try {
    const r = await fetch('/api/projects');
    const projects = await r.json();
    const sel = $('projectSelect');
    sel.innerHTML = projects.map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('');
    sel.addEventListener('change', ()=> setProject(sel.value));
    activeProject = projects[0] || '';
  } catch(_){}
  renderPlan();
  setInterval(()=>{ if (state.tab==='plan') renderPlan(); else if (state.tab==='task' && state.currentTask) renderTask(state.currentTask); }, 15000);
}
boot();
</script>
</body>
</html>
