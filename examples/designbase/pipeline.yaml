# Конфигурация конвейера для проекта DesignBase (Python, SQLite+FTS5, RAG по ПД ВВ-17).
# Задачи A-NN ведутся в Tasks\Активные\, отчёты в Tasks\Отчёты\.

project:
  name: designbase
  root: [D:\Projects\DesignBase, E:\ПлагиныРевит\DesignBase]
  branch: main

# План проекта в ProjectsPalns
plan:
  repo: [D:\Projects\ProjectsPalns, E:\ПлагиныРевит\ProjectsPalns]
  subdir: DesignBase
  file: 2026-08-29_stage-e2-chat-kb-ingest.md

# Параметры план-раннера
runner:
  model: opencode-go/deepseek-v4-flash
  retries: 2
  question_timeout_sec: 1200
  checkpoint_stages: true

tasks:
  inbox: Tasks\Входящие
  active: Tasks\Активные
  reports: Tasks\Отчёты
  archive: Tasks\Архив
  protocol: Tasks\00_Протокол_агентов.md
  status: Tasks\Статус_конвейера.md
  conveyor: Tasks\Конвейер
  notif: Tasks\Конвейер\Уведомления

build:
  # Python-проект: отдельная сборка не нужна (msbuild: none)
  msbuild: none
  sln: ""
  configuration: ""
  platform: ""
  extra_args: []

tests:
  runner: pytest
  vstest: ""
  dll: tests
  baseline_passed: 219
  baseline_total: 219

checks:
  - id: A-01
    label: 'Разделы ПП №87: NULL-документов ≤68'
    kind: grep_dir
    dir: scripts
    pattern: "^PLACEHOLDER_NEVER_MATCHES$"
    expect: 0

layer_rules:
  - label: 'Core не зависит от API/UI (src/designbase/ingest не импортирует api)'
    pattern: from\s+designbase\.api|import\s+designbase\.api
    expect: 0
    dirs: [src/designbase/ingest]

audit_dirs: [tests]
