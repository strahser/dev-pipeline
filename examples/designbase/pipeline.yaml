# Конфигурация конвейера для проекта DesignBase (Python, SQLite+FTS5, RAG по ПД ВВ-17).
# Задачи A-NN ведутся в Tasks\Активные\, отчёты в Tasks\Отчёты\.
# План работ: E:\ПлагиныРевит\ProjectsPalns\DesignBase\_current\2026-08-21_regulatory-compliance-cross-analysis.md

project:
  name: designbase
  root: [E:\ПлагиныРевит\DesignBase]
  branch: master

tasks:
  inbox: Tasks\Входящие
  active: Tasks\Активные
  reports: Tasks\Отчёты
  archive: Tasks\Архив
  protocol: Tasks\00_Протокол_агентов.md
  status: Tasks\Статус_конвейера.md
  conveyor: Tasks\Конвейер
  notif: Tasks\Конвейер\Уведомления

build:
  # Python-проект: «сборка» = smoke-импорт пакета (быстрая проверка окружения)
  msbuild: python
  sln: "-c import designbase; print('designbase OK')"
  configuration: ""
  platform: ""
  extra_args: []

tests:
  runner: pytest
  vstest: ""
  dll: tests
  baseline_passed: 29
  baseline_total: 29

tdl:
  enabled: false

checks:
  - id: A-01
    label: 'Разделы ПП №87: NULL-документов ≤68'
    kind: grep_dir
    dir: scripts
    pattern: "^PLACEHOLDER_NEVER_MATCHES$"
    expect: 0

layer_rules:
  - label: 'Core не зависит от API/UI (src/designbase/ingest не импортирует api)'
    pattern: from\s+designbase\.api|import\s+designbase\.api
    expect: 0
    dirs: [src/designbase/ingest]

audit_dirs: [tests]
