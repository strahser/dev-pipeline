# Конфигурация конвейера для проекта MepTaggingSolution (Revit-плагин, C# .NET 8 / net48).
# Быстрые проверки — через Core.Tests (net48, NUnit, без Revit SDK).
# Базовое состояние на 2026-08-06: Core.Tests 15 тестов, 8 PASS / 7 FAIL (коллизии реальные).

project:
  name: MepTaggingSolution
  # Несколько рабочих мест: первый существующий путь будет выбран автоматически
  # (также можно задать DEV_PIPELINE_PROJECTS_DIR — базовая папка проектов на ПК).
  root: [D:\Projects\MepTaggingSolution, E:\ПлагиныРевит\MepTaggingSolution]
  branch: feature/tagging-extension-tests

# План проекта в репозитории ProjectsPalns (источник карточек план-раннера)
plan:
  repo: [D:\Projects\ProjectsPalns, E:\ПлагиныРевит\ProjectsPalns]
  subdir: MepTaggingSolution
  file: 2026-08-21_leader-crossing-roomtag-fix.md

# Параметры план-раннера (python -m agents.plan_runner --project meptaggingsolution)
runner:
  model: opencode-go/deepseek-v4-flash
  retries: 2
  question_timeout_sec: 1200   # тишина по вопросу 20 мин -> работа по допущениям
  checkpoint_stages: true      # пауза после закрытия этапа до одобрения в панели

tasks:
  inbox: Tasks\Входящие
  active: Tasks\Активные
  reports: Tasks\Отчёты
  archive: Tasks\Архив
  protocol: Tasks\00_Протокол_агентов.md
  status: Tasks\Статус_конвейера.md
  conveyor: Tasks\Конвейер
  notif: Tasks\Конвейер\Уведомления

build:
  # Быстрая сборка без Revit (MSB4062/Revit SDK в MepTagging.Tests проблемный — см. REFACTORING_PLAN.md P7)
  msbuild: dotnet
  sln: Core.Tests/Core.Tests.csproj
  configuration: Debug
  platform: Any CPU
  extra_args:
    - --nologo
    - -v
    - q

tests:
  runner: dotnet
  vstest: ""
  dll: Core.Tests/Core.Tests.csproj
  # Быстрый набор для верификации карточек (полный прогон >10 мин):
  # исключены матрицы стратегий по фикстурам и env-зависимые golden-тесты.
  filter: "FullyQualifiedName!~BridgeStrategyRunTests&FullyQualifiedName!~CoreCollisionTests&FullyQualifiedName!~GoldenIdentityTests"
  # Baseline 2026-08-22 (замер): 230 pass / 2 fail / 1 skip за 2 мин.
  # Известные падения — битая пустая фикстура View1 (см. ревью плана).
  baseline_passed: 230
  baseline_total: 233
  known_failures:
    - ComputePlacements_Is_Fast_Enough
    - ComputePlacements_Produces_Deterministic_Results

# Декларативные проверки задач (для пилота на MepTaggingSolution)
checks:
  - id: A-01
    label: 'Core не ссылается на Revit (using Autodesk.Revit в Core = 0)'
    kind: grep_dir
    dir: Core
    pattern: using\s+Autodesk\.Revit
    expect: 0

  - id: A-02
    label: 'Модели не ссылаются на Revit (Models чисто)'
    kind: grep_dir
    dir: Models
    pattern: using\s+Autodesk\.Revit
    expect: 0

layer_rules:
  - label: Core без Autodesk.Revit (guard-слой)
    pattern: using\s+Autodesk\.Revit
    expect: 0
    dirs: [Core, CoreCBR, Models]
  - label: Core.Tests без Revit SDK
    pattern: Nice3point\.Revit
    expect: 0
    dirs: [Core.Tests]

audit_dirs: [Core.Tests]
