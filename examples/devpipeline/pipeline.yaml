# Конфигурация конвейера для самого dev-pipeline (Python, самохостинг).
# План-раннер ведёт собственную доработку по плану
# ProjectsPalns\dev-pipeline\_current\2026-08-23_dev-pipeline-fixes.md.

project:
  name: devpipeline
  root: [D:\Projects\dev-pipeline]
  branch: main

# План проекта в ProjectsPalns
plan:
  repo: [D:\Projects\ProjectsPalns, E:\ПлагиныРевит\ProjectsPalns]
  subdir: dev-pipeline
  file: 2026-08-24_dev-pipeline-crew-manager-ui.md

# Параметры план-раннера
runner:
  model: opencode-go/deepseek-v4-flash
  retries: 2
  question_timeout_sec: 1200
  checkpoint_stages: true
  checkpoint_remind_sec: 600
  # Независимая reviewer-фаза после PASS (карточка 4.2): ревьюер во временном
  # git worktree сверяет факт с GOAL.md и планом; FAIL = штатный ретрай.
  semantic_review: false

# Crew: автономные сессии проекта (карточка 6.2)
crew:
  roles: [executor]
  model: ""
  permissions: write

restart_policy:
  max_restarts: 3
  cooldown_sec: 300

tasks:
  inbox: Tasks\Входящие
  active: Tasks\Активные
  reports: Tasks\Отчёты
  archive: Tasks\Архив
  protocol: Tasks\00_Протокол_агентов.md
  status: Tasks\Статус_конвейера.md
  conveyor: Tasks\Конвейер
  notif: Tasks\Конвейер\Уведомления

build:
  msbuild: none
  sln: ""
  configuration: ""
  platform: ""
  extra_args: []

tests:
  runner: pytest
  vstest: ""
  dll: tests
  baseline_passed: 121
  baseline_total: 121

checks: []

layer_rules:
  - label: 'agents не импортируют server (тонкие клиенты через pipeline.client)'
    pattern: from\s+server|import\s+server\b
    expect: 0
    dirs: [agents]

audit_dirs: []
