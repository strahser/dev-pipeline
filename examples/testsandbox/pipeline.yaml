# Песочница агентов dev-pipeline: тестовые прогоны панели/терминалов.
# Не связана с реальными проектами.

project:
  name: testsandbox
  root: [D:\Projects\sandbox-agent-test]

plan:
  repo: [D:\Projects]
  subdir: sandbox-agent-test

runner:
  model: opencode-go/deepseek-v4-flash
  retries: 1
  question_timeout_sec: 600
  checkpoint_stages: false

crew:
  roles: [executor]
  model: ""
  permissions: write

restart_policy:
  max_restarts: 2
  cooldown_sec: 0

tasks:
  inbox: Tasks\Входящие
  active: Tasks\Активные
  reports: Tasks\Отчёты
  archive: Tasks\Архив
  conveyor: Tasks\Конвейер
  notif: Tasks\Конвейер\Уведомления

build:
  msbuild: none
  sln: ""

tests:
  runner: none

checks: []
